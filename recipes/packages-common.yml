modules:
  - type: dnf
    install:
      packages:
        - syncthing
        - gcc
        - make
        - patch
        - binutils
        - git
        - NetworkManager-openvpn
        - openvpn
  - type: systemd
    system:
      enabled:
        - sshd.service
    user:
      enabled:
        - syncthing.service
