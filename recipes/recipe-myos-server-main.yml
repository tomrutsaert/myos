name: myos-server-main
description: my personal os headless development server image
base-image: ghcr.io/blue-build/base-images/fedora-base
image-version: 44

modules:
  # Shared headless-capable development platform
  - from-file: default-files.yml
  - from-file: packages-common.yml
  - from-file: docker.yml
  - from-file: virtualization.yml
  - from-file: tailscale.yml
  - from-file: netbird.yml
  - from-file: just.yml

  # Server access and headless ujust aggregates; no graphical desktop modules
  - from-file: packages-server.yml
  - from-file: just-server.yml

  - from-file: os-release.yml
  - type: initramfs
  - type: signing
  - from-file: signing-policy.yml
