modules:
  - type: dnf
    install:
      packages:
        - virt-install
        - libvirt-daemon-config-network
        - libvirt-daemon-kvm
        - libvirt-daemon-driver-qemu
        - qemu-kvm
        - qemu-img
        - virtiofsd
        - edk2-ovmf
        - virt-manager
        - virt-viewer
        - guestfs-tools
        - python3-libguestfs
  - type: systemd
    system:
      enabled:
        - libvirtd.service